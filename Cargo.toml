[package]
name = "almacen-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
rocket = { version = "0.5.0", features = ["json", "uuid"] }

chrono = "*"

# SeaORM
sea-orm = { version = "1.1.20", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros"
] }
sea-orm-migration = "^1.1.20"

# Async runtime (Rocket uses Tokio under the hood)
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

argon2 = "0.5.3"
dotenv = "0.15.0"

rocket_cors = "0.6.0"

jsonwebtoken = { version = "10.3.0", features = ['rust_crypto'] }

[dependencies.uuid]
version = "1.23.0"
# Lets you generate random UUIDs
features = [
    "v4",
]