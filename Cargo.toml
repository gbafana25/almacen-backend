[package]
name = "almacen-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
rocket = { version = "0.5.0", features = ["json", "uuid"] }

chrono = "*"

# SeaORM
sea-orm = { version = "1.1.20", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros"
] }
sea-orm-migration = "^1.1.20"

# Async runtime (Rocket uses Tokio under the hood)
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging (optional but useful)
tracing = "0.1"
tracing-subscriber = "0.3"